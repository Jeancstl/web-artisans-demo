<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Pages démo artisans</title></head>
<body>
<h1>Pages démo</h1>
<ul id="list"></ul>
<script>
fetch('demo-pages/manifest.json').then(r=>r.json()).then(list => {
  const ul = document.getElementById('list');
  list.forEach(f => {
    const li = document.createElement('li');
    li.innerHTML = '<a href="demo-pages/' + f + '">' + f + '</a>';
    ul.appendChild(li);
  });
});
</script>
</body>
</html>
